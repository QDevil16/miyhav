name: miyhav
description: "Miyhav - pet takip, sağlık ve sosyalleşme uygulaması"
# Private paket: pub.dev'e yayınlanmaz.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend istemcisi (Postgres/Auth/Storage/Realtime)
  supabase_flutter: ^2.8.0
  # State yönetimi ve bağımlılık enjeksiyonu
  flutter_riverpod: ^2.6.1
  # Deklaratif yönlendirme
  go_router: ^14.6.2
  # Yerelleştirme / tarih-sayı biçimlendirme
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled fontlar (çalışma zamanında indirilmez). Kaynak: Google Fonts / Jost
  # (SIL OFL). Variable font'tan fonttools ile statik ağırlıklar üretildi.
  # Lisans: assets/fonts/Jost-OFL.txt
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Regular.ttf
          weight: 400
        - asset: assets/fonts/Jost-Medium.ttf
          weight: 500
        - asset: assets/fonts/Jost-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Jost-Bold.ttf
          weight: 700
